# Mirrors tools/check.ps1 and tools/check.sh (the local gate). Keep all three in sync when
# adding a step.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python tools/sync_proto.py --check

  # c-format and host-tests need no IDF: they run on the plain runner instead of pulling the
  # IDF image (the local gate runs them in it). format_c.sh installs and checks the pinned
  # clang-format itself; the runner image has gcc and cmake.
  c-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: bash tools/format_c.sh --check

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/host_tests.sh

  tools-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }
      - run: go mod tidy -diff && go vet ./... && go test ./... && go build ./cmd/sshrunner
        working-directory: cli
        env: { CGO_ENABLED: "0" }

  fap:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sdk: [UNLEASHED, OFFICIAL]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch pinned SDK
        run: |
          url=$(grep -E "^${{ matrix.sdk }}_SDK_URL=" flipper-app/SDK_VERSION | cut -d= -f2-)
          ufbt update --hw-target=f7 --url="$url"
      - name: Build
        working-directory: flipper-app
        run: ufbt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh_runner-${{ matrix.sdk }}
          path: flipper-app/dist/ssh_runner.fap

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6 # keep equal to firmware-esp32/IDF_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ccache across runs: a new entry per commit, restored from the newest one of the same IDF
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-firmware-${{ hashFiles('firmware-esp32/IDF_VERSION') }}-${{ github.sha }}
          restore-keys: ccache-firmware-${{ hashFiles('firmware-esp32/IDF_VERSION') }}-
      - name: Build
        shell: bash
        working-directory: firmware-esp32
        run: |
          . $IDF_PATH/export.sh
          export CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache IDF_CCACHE_ENABLE=1 CCACHE_MAXSIZE=400M
          idf.py -B ../.cache/build/esp32 -D SDKCONFIG=../.cache/build/esp32/sdkconfig build
          ccache -s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            .cache/build/esp32/*.bin
            .cache/build/esp32/bootloader/bootloader.bin
            .cache/build/esp32/partition_table/partition-table.bin
            .cache/build/esp32/flash_args

  firmware-efusetest:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6 # keep equal to firmware-esp32/IDF_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ccache across runs: a new entry per commit, restored from the newest one of the same IDF
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-firmware-efusetest-${{ hashFiles('firmware-esp32/IDF_VERSION') }}-${{ github.sha }}
          restore-keys: ccache-firmware-efusetest-${{ hashFiles('firmware-esp32/IDF_VERSION') }}-
      - name: Build the virtual-eFuse test overlay
        shell: bash
        working-directory: firmware-esp32
        run: |
          . $IDF_PATH/export.sh
          export CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache IDF_CCACHE_ENABLE=1 CCACHE_MAXSIZE=400M
          idf.py -B ../.cache/build/esp32-efusetest -D SDKCONFIG=../.cache/build/esp32-efusetest/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.efusetest" build
          ccache -s
